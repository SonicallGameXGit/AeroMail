[package]
name = "mailclient"
description = "Desktop and mobile shell of the mail client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mailclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
mail-core.workspace = true
mail-autoconfig.workspace = true
mail-engine.workspace = true
mail-protocols.workspace = true
mail-store.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[lints]
workspace = true

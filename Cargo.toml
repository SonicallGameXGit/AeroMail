[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.dependencies]
mail-core = { path = "crates/mail-core" }
mail-autoconfig = { path = "crates/mail-autoconfig" }
mail-protocols = { path = "crates/mail-protocols" }
mail-store = { path = "crates/mail-store" }
mail-render = { path = "crates/mail-render" }
mail-engine = { path = "crates/mail-engine" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# `pnpm dev` runs this profile. The libraries (TLS, SQLite, the mail and HTML
# parsers) are compiled once, so optimising them costs nothing on a rebuild,
# and unoptimised they made every sync and every opened message about three
# times slower than in an installed build.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "mail-protocols"
description = "IMAP and SMTP clients behind the core transport traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mail-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
utf7-imap = "0.3"
hickory-resolver = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }


[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

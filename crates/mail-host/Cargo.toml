[package]
name = "mail-host"
description = "Runs the mail engine as a process the desktop shell talks to over stdin and stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mailclient-core"
path = "src/main.rs"

[dependencies]
mail-core.workspace = true
mail-autoconfig.workspace = true
mail-engine.workspace = true
mail-protocols.workspace = true
mail-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true
